[package]
name = "bloomterm-desktop"
version = "0.1.0"
description = "bloomterm's desktop app: runs bloomd and shows its web app"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "bloomterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
libc = "0.2"
tauri-plugin-updater = { version = "2", optional = true }

[features]
# Release builds (scripts/release.sh) check for updates; `make app` builds don't.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
lto = true
codegen-units = 1
strip = true
